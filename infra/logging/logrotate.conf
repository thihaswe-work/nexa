# Nexa Log Rotation Configuration
# Place at /etc/logrotate.d/nexa

/var/log/nexa/*.log {
  daily
  rotate 30
  compress
  delaycompress
  missingok
  notifempty
  dateext
  dateformat -%Y%m%d
  sharedscripts
  postrotate
    kill -USR1 $(cat /var/run/fluentd.pid 2>/dev/null) 2>/dev/null || true
  endscript
}

/var/log/nginx/*.log {
  daily
  rotate 30
  compress
  delaycompress
  missingok
  notifempty
  dateext
  dateformat -%Y%m%d
  sharedscripts
  postrotate
    nginx -s reopen 2>/dev/null || true
  endscript
}

/var/log/containers/*.log {
  daily
  rotate 7
  compress
  missingok
  notifempty
  copytruncate
}
