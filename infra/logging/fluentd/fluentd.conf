# Fluentd Configuration for Nexa Log Aggregation

<source>
  @type forward
  port 24224
  bind 0.0.0.0
  tag nexa.*
</source>

<source>
  @type tail
  path /var/log/containers/*.log
  pos_file /var/log/fluentd-containers.log.pos
  tag kube.*
  format json
  read_from_head false
</source>

# ── API Logs ──────────────────────────────
<filter nexa.api.**>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type json
  </parse>
</filter>

<match nexa.api.**>
  @type copy
  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
    logstash_format true
    logstash_prefix nexa-api
    flush_interval 5s
    <buffer>
      @type memory
      chunk_limit_size 2MB
      flush_interval 5s
    </buffer>
  </store>
  <store>
    @type file
    path /var/log/nexa/api/
    <buffer>
      @type file
      path /var/log/nexa/buffer/api
    </buffer>
  </store>
</match>

# ── Nginx Access Logs ─────────────────────
<match nexa.nginx.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix nexa-nginx
  flush_interval 5s
  <buffer>
    @type memory
    chunk_limit_size 2MB
    flush_interval 5s
  </buffer>
</match>

# ── Application Audit Logs ────────────────
<match nexa.audit.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix nexa-audit
  flush_interval 1s
  <buffer>
    @type memory
    chunk_limit_size 1MB
    flush_interval 1s
  </buffer>
</match>

# ── Error Logs ────────────────────────────
<match nexa.error.**>
  @type copy
  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
    logstash_format true
    logstash_prefix nexa-error
    flush_interval 1s
  </store>
  <store>
    @type file
    path /var/log/nexa/error/
    <buffer>
      @type file
      path /var/log/nexa/buffer/error
    </buffer>
  </store>
</match>

# ── Catch-all (fallback) ──────────────────
<match **>
  @type stdout
</match>
