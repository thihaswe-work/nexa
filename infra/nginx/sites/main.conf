# Main Application
server {
  listen 80;
  server_name nexa.app www.nexa.app;

  # Redirect to HTTPS (enable when certs configured)
  # return 301 https://$host$request_uri;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  # Security
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  location ~ /\.git {
    deny all;
  }
}
