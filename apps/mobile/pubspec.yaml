name: nexa_mobile
description: Nexa location-based social app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Routing
  go_router: ^14.0.0

  # Networking
  dio: ^5.4.0
  web_socket_channel: ^2.4.0

  # Storage
  flutter_secure_storage: ^9.0.0

  # Map
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Permission
  permission_handler: ^11.3.0

  # Offline Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Voice
  record: ^5.1.0
  just_audio: ^0.9.36

  # Utilities
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  fpdart: ^1.1.0
  geolocator: ^11.0.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  path_provider: ^2.1.2

  # Firebase (for FCM)
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.0

  # Image
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.0
  mocktail: ^1.0.0

dependency_overrides:
  record_linux: ^1.3.1

flutter:
  uses-material-design: true
