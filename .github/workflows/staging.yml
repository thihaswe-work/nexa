name: Staging Deploy

on:
  push:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "**.md"

env:
  REGISTRY: ghcr.io
  API_IMAGE: ${{ github.repository }}/api
  ADMIN_IMAGE: ${{ github.repository }}/admin

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API (staging)
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: apps/api/Dockerfile
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Admin (staging)
        uses: docker/build-push-action@v5
        with:
          context: apps/admin
          file: apps/admin/Dockerfile
          target: production
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.ADMIN_IMAGE }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to staging server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }} '
            cd /opt/nexa-staging &&
            docker compose pull &&
            docker compose up -d --remove-orphans
          '
