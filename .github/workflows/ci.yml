name: CI

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "infra/**"

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci --no-audit --no-fund || npm ci --no-audit --no-fund

      - name: Check ESLint configs
        run: |
          find . -name ".eslintrc*" -o -name "eslint.config.*"

      - name: Run lint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci --no-audit --no-fund || npm ci --no-audit --no-fund

      - name: Prisma generate
        working-directory: apps/api
        run: npx prisma generate

      - name: API typecheck
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Admin typecheck
        working-directory: apps/admin
        run: npx tsc --noEmit

  test-api:
    name: API Tests

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4

        env:
          POSTGRES_DB: nexa_test
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U nexa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci --no-audit --no-fund || npm ci --no-audit --no-fund

      - name: Prisma generate
        working-directory: apps/api
        run: npx prisma generate

      - name: Reset database

        working-directory: apps/api

        env:
          DATABASE_URL: postgresql://nexa:nexa@localhost:5432/nexa_test

        run: |

          npx prisma migrate reset --force

      - name: Seed database

        working-directory: apps/api

        env:
          DATABASE_URL: postgresql://nexa:nexa@localhost:5432/nexa_test

        run: |

          npm run prisma:seed

      - name: Run tests

        working-directory: apps/api

        env:
          DATABASE_URL: postgresql://nexa:nexa@localhost:5432/nexa_test

          REDIS_URL: redis://localhost:6379

          JWT_SECRET: test-secret-key-that-is-at-least-32-characters-long

        run: |

          npm test

          npm run test:e2e

  test-admin:
    name: Admin Tests

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4

        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci --no-audit --no-fund || npm ci --no-audit --no-fund

      - name: Test Admin

        working-directory: apps/admin

        run: npm test

  test-mobile:
    name: Flutter Tests

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2

        with:
          flutter-version: "3.44.8"
          cache: true

      - name: Flutter dependencies

        working-directory: apps/mobile

        run: flutter pub get

      - name: Flutter tests

        working-directory: apps/mobile

        run: flutter test

  build:
    name: Build

    runs-on: ubuntu-latest

    needs:
      - lint
      - typecheck
      - test-api
      - test-admin
      - test-mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4

        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci --no-audit --no-fund || npm ci --no-audit --no-fund

      - name: Prisma generate

        working-directory: apps/api

        run: npx prisma generate

      - name: Build all

        run: npm run build

      - name: Upload API
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: apps/api/dist
          retention-days: 1

      - name: Upload Admin
        uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: apps/admin/.next
          retention-days: 1
