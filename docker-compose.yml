version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  nexa-net:
    driver: bridge
  nexa-internal:
    driver: bridge
    internal: true

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

services:
  # ── Databases ────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-nexa_prod}
      POSTGRES_USER: ${DATABASE_USER:-nexa}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Database password required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - nexa-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-nexa}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: nexa-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - nexa-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ── Object Storage ──────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: nexa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-nexa}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MinIO secret key required}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - nexa-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ── Application Services ────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: nexa-api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512M"
        reservations:
          cpus: "0.5"
          memory: "256M"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      REDIS_PREFIX: nexa:
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      JWT_ISSUER: ${JWT_ISSUER:-nexa-api}
      SMTP_HOST: ${SMTP_HOST:-smtp}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@nexa.app}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-nexa-uploads}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-nexa}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3 secret key required}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - nexa-net
      - nexa-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      target: production
    container_name: nexa-admin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.25"
          memory: "128M"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${API_URL:-https://api.nexa.app}
      NEXTAUTH_URL: ${ADMIN_URL:-https://admin.nexa.app}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NextAuth secret required}
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - nexa-net
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  # ── Monitoring ──────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: nexa-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - nexa-internal
    logging: *default-logging

  grafana:
    image: grafana/grafana:10.4.0
    container_name: nexa-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Grafana admin password required}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./infra/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - nexa-net
      - nexa-internal
    depends_on:
      - prometheus
    logging: *default-logging

  # ── Reverse Proxy ──────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nexa-nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/sites:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - nexa-net
    depends_on:
      - api
      - admin
    logging: *default-logging
